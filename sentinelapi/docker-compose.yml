version: '3.8'

services:
  demo-api:
    build: ./demo-api
    ports:
      - "8001:8001"
    environment:
      - MODE=vulnerable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  scanner:
    build: ./scanner
    ports:
      - "8000:8000"
    environment:
      - DEMO_API_URL=http://demo-api:8001
    depends_on:
      demo-api:
        condition: service_healthy
    volumes:
      - ./samples:/app/samples

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - SCANNER_URL=http://scanner:8000
    depends_on:
      - scanner